databases:
  - name: afyanow-db
    databaseName: afyanow
    user: afyanow
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: afyanow-backend
    runtime: node
    repo: https://github.com/michaelbahati1281-debug/AfyaNow.git
    branch: main
    rootDir: afyanow-backend
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npx prisma db push --skip-generate && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afyanow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://afyanowreact.vercel.app
      - key: NODE_ENV
        value: production